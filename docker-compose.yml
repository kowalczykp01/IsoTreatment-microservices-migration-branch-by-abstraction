services:
  monolith:
    build:
      context: .
      dockerfile: IsoTreatmentProcessSupportAPI/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      monolith.database:
        condition: service_healthy
    environment:
      - ConnectionStrings__IsoSupportDb=Server=monolith.database,1433;Database=IsoTreatmentProcessSupport;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;
      - Authentication__SigningKey=${AUTHENTICATION_SIGNING_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=monolith
      - Features__UseTreatmentServiceForReminders=false
      - TreatmentService__BaseAddress=http://treatment:8080/
      - EmailHost
      - EmailUsername
      - EmailPassword

  monolith.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s

  treatment:
    build:
      context: .
      dockerfile: TreatmentService/TreatmentService.Api/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      treatment.database:
        condition: service_healthy
    environment:
      - ConnectionStrings__TreatmentDb=Server=treatment.database,1433;Database=Treatment;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;
      - Authentication__SigningKey=${AUTHENTICATION_SIGNING_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=treatment

  treatment.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "14331:1433"
    volumes:
      - treatment-mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  mssql-data:
  treatment-mssql-data:
